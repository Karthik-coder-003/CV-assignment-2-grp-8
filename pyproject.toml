[project]
name = "cv-assignment-2-grp-8"
version = "0.1.0"
description = "Computer Vision Assignment 2 - Group 8"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "opencv-python>=4.10",
    "pillow>=10.3",
    "torch>=2.3",
    "transformers>=4.41",
    "sentence-transformers>=2.7",
    "scikit-learn>=1.5",
    "av>=12.0",
    "lighthouse",
]

[tool.uv.sources]
lighthouse = { git = "https://github.com/line/lighthouse.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
