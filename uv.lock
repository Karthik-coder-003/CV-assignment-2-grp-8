# This lockfile is generated by uv and ensures all team members use
# the exact same package versions in their virtual environments.
#
# Usage:
#   1. Install uv: https://docs.astral.sh/uv/getting-started/installation/
#   2. Run: uv sync
#      This reads uv.lock and sets up an identical venv for everyone.
#
# To add a new dependency:
#   uv add <package>         # updates pyproject.toml AND uv.lock
#   Then commit both files.
#
# IMPORTANT: Always commit uv.lock so teammates stay in sync.

version = 1
requires-python = ">=3.10"
